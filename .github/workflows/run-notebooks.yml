name: Execute Quantum Computing Experiments

on:
  push:
  workflow_dispatch:

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install pennylane numpy matplotlib jupyter nbconvert ipykernel

      - name: Create executed notebooks folder
        run: mkdir -p executed

      - name: Execute all notebooks
        run: |
          for file in experiments/*.ipynb
          do
            jupyter nbconvert \
              --to notebook \
              --execute "$file" \
              --output-dir executed \
              --ExecutePreprocessor.timeout=120 \
              --ExecutePreprocessor.kernel_name=python3
          done

      - name: Upload executed notebooks
        uses: actions/upload-artifact@v4
        with:
          name: executed-quantum-experiments
          path: executed/
