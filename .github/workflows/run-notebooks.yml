name: Execute Quantum Computing Experiments

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install pennylane numpy matplotlib jupyter nbconvert ipykernel

      - name: Execute notebooks in place
        run: |
          for file in experiments/*.ipynb
          do
            echo "Executing $file"
            jupyter nbconvert \
              --to notebook \
              --execute "$file" \
              --inplace \
              --ExecutePreprocessor.timeout=120 \
              --ExecutePreprocessor.kernel_name=python3
          done

      - name: Commit executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add experiments/*.ipynb

          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Execute quantum computing experiments [skip ci]"
          fi

      - name: Sync with remote main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push executed notebooks
        run: |
          git push origin HEAD:main
